spring:
  application:
    name: flower-subscription-backend

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration

  jpa:
    hibernate:
      ddl-auto: validate

    open-in-view: false

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info

  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs

  swagger-ui:
    path: /swagger-ui.html

info:
  application:
    name: ${spring.application.name}
    description: Backend REST API for a flower shop subscription service